spring:
  application:
    name: energy-analysis-api

  datasource:
    url: jdbc:postgresql://localhost:5432/energiai
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    api-docs:
        path: /v3/api-docs

server:
  port: 8080
  inference-service:
    url: ${INFERENCE_SERVICE_URL:http://localhost:8000}